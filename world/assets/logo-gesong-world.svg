<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80">
  <defs>
    <linearGradient id="gradWorld" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Globe & Music Note -->
  <g transform="translate(10, 10)">
    <circle cx="30" cy="30" r="28" fill="#1e1b4b" stroke="url(#gradWorld)" stroke-width="2.5" />
    <ellipse cx="30" cy="30" rx="26" ry="13" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.7" />
    <ellipse cx="30" cy="30" rx="13" ry="26" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.7" />
    <line x1="4" y1="30" x2="56" y2="30" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <line x1="30" y1="4" x2="30" y2="56" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <path d="M24 38 A4 4 0 1 1 20 34 L20 20 L38 16 L38 32 A4 4 0 1 1 34 28 L34 22 L24 25 Z" fill="url(#gradWorld)" filter="url(#glow)" />
  </g>
  <!-- Text Brand -->
  <text x="82" y="46" font-family="'Noto Serif TC', 'Songti TC', serif" font-weight="900" font-size="36" fill="url(#gradWorld)" letter-spacing="2" filter="url(#glow)">歌SONG世界</text>
  <!-- Badge -->
  <rect x="84" y="55" width="160" height="16" rx="8" fill="#312e81" stroke="#6366f1" stroke-width="0.8" />
  <text x="164" y="67" font-family="'Noto Sans TC', sans-serif" font-weight="700" font-size="9" fill="#e0e7ff" text-anchor="middle" letter-spacing="1.5">九上閱思龍門・放眼世界</text>
  <text x="260" y="67" font-family="'Noto Sans TC', sans-serif" font-weight="500" font-size="9.5" fill="#94a3b8" letter-spacing="0.5">GLOBAL SOUNDSCAPE</text>
</svg>